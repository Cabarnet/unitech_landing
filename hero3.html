<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unitech - Hero Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== Hero секция ===== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(135deg, #fafbfc 0%, #ffffff 100%);
    }

    /* ===== Контейнер для логотипа и форм ===== */
    .logo-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 86px;
      height: 85px;
      z-index: 5;
      opacity: 0;
      animation: logoAppear 1.2s ease-out 0.3s forwards;
    }

    @keyframes logoAppear {
      to { opacity: 1; }
    }

    .logo-svg {
      width: 100%;
      height: 100%;
    }

    .logo-path {
      fill: #767779;
      transition: fill 0.3s ease;
    }

    .logo-path.yellow {
      fill: #e9df14;
    }

    /* ===== Анимация укрупнения и исчезновения логотипа ===== */
    .logo-stage.expanding {
      animation: logoExpand 2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
      animation-delay: 2s;
    }

    @keyframes logoExpand {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
      60% {
        opacity: 0.4;
      }
      100% {
        transform: translate(-50%, -50%) scale(8);
        opacity: 0;
      }
    }

    /* ===== Контейнер для летающих арок ===== */
    .arcs-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 3;
    }

    .arc {
      position: absolute;
      opacity: 0;
      will-change: transform, opacity;
      transform-origin: center;
    }

    .arc-path {
      fill: none;
      stroke: #b8b9bb;
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 0.6;
    }

    .arc-path.yellow {
      stroke: #e9df14;
      stroke-width: 3;
      opacity: 0.8;
    }

    /* ===== Анимация появления арок после исчезновения логотипа ===== */
    .arc.visible {
      opacity: 1;
      animation: arcFloat var(--duration) ease-in-out var(--delay) infinite;
    }

    @keyframes arcFloat {
      0% {
        transform: 
          translate(var(--start-x), var(--start-y)) 
          scale(var(--scale)) 
          rotate(var(--start-rotate));
        opacity: 0;
      }
      10% {
        opacity: var(--opacity);
      }
      45% {
        transform: 
          translate(var(--mid-x), var(--mid-y)) 
          scale(var(--scale)) 
          rotate(var(--mid-rotate));
      }
      55% {
        opacity: var(--opacity);
      }
      90% {
        transform: 
          translate(var(--end-x), var(--end-y)) 
          scale(var(--scale)) 
          rotate(var(--end-rotate));
        opacity: 0;
      }
      100% {
        opacity: 0;
      }
    }

    /* ===== Контент Hero ===== */
    .hero-content {
      position: relative;
      z-index: 10;
      max-width: 800px;
      padding: 0 40px;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s ease, transform 1s ease;
    }

    .hero-content.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-badge {
      display: inline-block;
      padding: 8px 20px;
      background: rgba(233, 223, 20, 0.15);
      color: #5a5a5a;
      font-size: 14px;
      font-weight: 500;
      border-radius: 20px;
      margin-bottom: 24px;
      letter-spacing: 0.02em;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.6s ease 0.5s, transform 0.6s ease 0.5s;
    }

    .hero-content.visible .hero-badge {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-title {
      font-size: clamp(2.5rem, 5.5vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #1a1a1a;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease 0.7s, transform 0.8s ease 0.7s;
    }

    .hero-content.visible .hero-title {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-subtitle {
      font-size: clamp(1.125rem, 2.5vw, 1.375rem);
      line-height: 1.6;
      color: #767779;
      max-width: 600px;
      margin: 0 auto 40px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease 0.9s, transform 0.8s ease 0.9s;
    }

    .hero-content.visible .hero-subtitle {
      opacity: 1;
      transform: translateY(0);
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 18px 40px;
      background: #e9df14;
      color: #1a1a1a;
      font-weight: 600;
      font-size: 1.0625rem;
      text-decoration: none;
      border-radius: 12px;
      opacity: 0;
      transform: translateY(20px);
      transition: 
        opacity 0.8s ease 1.1s, 
        transform 0.8s ease 1.1s,
        box-shadow 0.3s ease,
        transform 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .hero-content.visible .cta-button {
      opacity: 1;
      transform: translateY(0);
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(233, 223, 20, 0.4);
    }

    .cta-button:active {
      transform: translateY(0);
    }

    /* ===== Адаптивность ===== */
    @media (max-width: 768px) {
      .hero-content {
        padding: 0 24px;
      }

      .hero-title {
        font-size: clamp(2rem, 7vw, 2.75rem);
      }

      .hero-subtitle {
        font-size: clamp(1rem, 3vw, 1.125rem);
      }

      .arc {
        /* Уменьшаем масштаб арок на мобильных */
        transform: scale(0.6);
      }
    }

    /* ===== Отключение анимаций ===== */
    @media (prefers-reduced-motion: reduce) {
      .logo-stage,
      .arc,
      .hero-content,
      .hero-badge,
      .hero-title,
      .hero-subtitle,
      .cta-button {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }

      .logo-stage {
        opacity: 0 !important;
      }
    }
  </style>
</head>
<body>
  <!-- Hero секция -->
  <section class="hero">
    <!-- Логотип в центре (исчезает) -->
    <div class="logo-stage" id="logoStage">
      <svg class="logo-svg" viewBox="0 0 86 85" xmlns="http://www.w3.org/2000/svg">
        <path class="logo-path" d="M34.6,68.5c-1,0-2-.5-3-1l-1.4-.9c-2.6-1.8-3.3-5.5-1.6-8.2l7.3-10.8c.4-.7,1.3-1,2.1-.3.7.4,1,1.3.3,2.1l-7.3,10.7c-.8,1.4-.5,3.1.8,3.9l1.5,1c1.4.8,3.1.5,3.9-.8l26.6-39.1c.8-1.4.5-3.1-.8-3.9l-1.4-.9c-1.4-.8-3.1-.5-3.9.8l-12.1,17.9c-.4.7-1.3,1-2.1.3-.7-.4-1-1.3-.3-2.1l12.3-18c1.8-2.6,5.5-3.3,8.2-1.6l1.5,1c2.6,1.8,3.3,5.5,1.6,8.2l-26.9,39.3c-1.1,1.8-3.2,2.8-5.2,2.6v-.2Z"/>
        <path class="logo-path" d="M46.8,71.1c-.8,0-1.4-.6-1.5-1.3,0-.8.5-1.6,1.4-1.7,15.4-1.3,27.3-14.2,27.6-29.7,0-3-.3-5.9-1-8.7-.2-.8.2-1.6,1.1-1.9.8-.2,1.6.2,1.9,1.1.8,3.1,1.3,6.3,1.2,9.5-.3,17.1-13.5,31.1-30.4,32.7-.1,0-.2,0-.3,0h0Z"/>
        <path class="logo-path" d="M21.9,61.2c-.4,0-.8,0-1-.3-6.8-6.1-10.7-14.5-11.1-23.5-.2-5.7,1-11.4,3.5-16.5.3-.7,1.2-1.1,2-.6s1.1,1.2.6,2c-2.3,4.6-3.5,9.9-3.3,15.1.3,8.3,3.9,15.9,10.1,21.4.6.6.7,1.5,0,2.1,0,.2-.4.3-.8.4h0Z"/>
        <path class="logo-path yellow" d="M43.4,47.7c-0.4,0-0.8,0-1.1-.4l-17.8-20.1c-2.1-2.5-1.9-6.2.5-8.3l1.2-1.2c1.1-1.1,2.8-1.5,4.3-1.5s3.1.8,4,1.9l8,9c.6.6.5,1.5-.2,2.1s-1.5.5-2.1-.2l-8-9c-0.5-0.5-1.3-0.8-2-1-0.8,0-1.5.2-2,.7l-1.2,1.3c-1.1,1.1-1.3,3-0.2,4.1l17.9,20.1c.6.6.5,1.5-.2,2.1-0.3,0.4-0.7,0.6-1.1,0.5h0Z"/>
        <path class="logo-path yellow" d="M42.6,77.4c-17.8-0.5-33-13-37-30.3-0.2-0.8.3-1.6,1.2-1.8.8-0.2,1.6.3,1.8,1.2,3.6,16,17.7,27.6,34.2,28.1,13.5.4,26-6.7,32.7-18.5.4-0.7,1.3-1,2-0.5.7.4,1,1.3.5,2-7.1,12.6-20.7,20.3-35.4,19.8Z"/>
      </svg>
    </div>

    <!-- Контейнер для летающих арок -->
    <div class="arcs-container" id="arcsContainer"></div>

    <!-- Текстовый контент -->
    <div class="hero-content" id="heroContent">
      <div class="hero-badge">10+ лет • 50+ проектов</div>
      <h1 class="hero-title">Разрабатываем цифровые сервисы<br>и платформы для телекома и госсектора</h1>
      <p class="hero-subtitle">для операторов мобильной связи, государственных интеграций, логистики и IoT-решений</p>
      <a href="#contact" class="cta-button">Обсудить проект →</a>
    </div>
  </section>

  <script>
    // ===== Полукруглые элементы из логотипа (только rounded paths) =====
    // Используем только 2 желтых элемента как наиболее выразительные полукруглые формы
    const arcPaths = [
      {
        d: 'M43.4,47.7c-0.4,0-0.8,0-1.1-.4l-17.8-20.1c-2.1-2.5-1.9-6.2.5-8.3l1.2-1.2c1.1-1.1,2.8-1.5,4.3-1.5s3.1.8,4,1.9l8,9c.6.6.5,1.5-.2,2.1s-1.5.5-2.1-.2l-8-9c-0.5-0.5-1.3-0.8-2-1-0.8,0-1.5.2-2,.7l-1.2,1.3c-1.1,1.1-1.3,3-0.2,4.1l17.9,20.1c.6.6.5,1.5-.2,2.1-0.3,0.4-0.7,0.6-1.1,0.5h0Z',
        color: 'yellow',
        baseSize: 80
      },
      {
        d: 'M42.6,77.4c-17.8-0.5-33-13-37-30.3-0.2-0.8.3-1.6,1.2-1.8.8-0.2,1.6.3,1.8,1.2,3.6,16,17.7,27.6,34.2,28.1,13.5.4,26-6.7,32.7-18.5.4-0.7,1.3-1,2-0.5.7.4,1,1.3.5,2-7.1,12.6-20.7,20.3-35.4,19.8Z',
        color: 'yellow',
        baseSize: 110
      }
    ];

    const arcsContainer = document.getElementById('arcsContainer');
    const logoStage = document.getElementById('logoStage');
    const heroContent = document.getElementById('heroContent');

    // ===== Генерация случайных параметров для дуги =====
    function generateArcParams() {
      const viewportW = window.innerWidth;
      const viewportH = window.innerHeight;
      
      // Случайная стартовая позиция (за пределами экрана)
      const startX = (Math.random() > 0.5 ? -1 : 2) * viewportW * (0.3 + Math.random() * 0.4);
      const startY = (Math.random() - 0.5) * viewportH * 0.8;
      
      // Случайная средняя точка (центр экрана с отклонением)
      const midX = (Math.random() - 0.5) * viewportW * 0.4;
      const midY = (Math.random() - 0.5) * viewportH * 0.4;
      
      // Случайная конечная позиция (противоположная сторона)
      const endX = (Math.random() > 0.5 ? 2 : -1) * viewportW * (0.3 + Math.random() * 0.4);
      const endY = (Math.random() - 0.5) * viewportH * 0.8;
      
      return {
        startX: startX + 'px',
        startY: startY + 'px',
        midX: midX + 'px',
        midY: midY + 'px',
        endX: endX + 'px',
        endY: endY + 'px',
        startRotate: Math.random() * 360 + 'deg',
        midRotate: (Math.random() * 360 + 180) + 'deg',
        endRotate: (Math.random() * 360 + 360) + 'deg',
        scale: 200, // 200x укрупнение как запрошено
        opacity: 0.08 + Math.random() * 0.12,
        duration: 18 + Math.random() * 12 + 's',
        delay: Math.random() * 4 + 's'
      };
    }

    // ===== Создание арок =====
    function createArcs() {
      // Создаем 8 арок для плотного, но не перегруженного фона
      for (let i = 0; i < 8; i++) {
        const arcData = arcPaths[i % arcPaths.length];
        const params = generateArcParams();
        
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 86 85');
        svg.classList.add('arc');
        
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', arcData.d);
        path.classList.add('arc-path');
        if (arcData.color === 'yellow') path.classList.add('yellow');
        
        svg.appendChild(path);
        
        // Применяем параметры анимации через CSS переменные
        svg.style.setProperty('--start-x', params.startX);
        svg.style.setProperty('--start-y', params.startY);
        svg.style.setProperty('--mid-x', params.midX);
        svg.style.setProperty('--mid-y', params.midY);
        svg.style.setProperty('--end-x', params.endX);
        svg.style.setProperty('--end-y', params.endY);
        svg.style.setProperty('--start-rotate', params.startRotate);
        svg.style.setProperty('--mid-rotate', params.midRotate);
        svg.style.setProperty('--end-rotate', params.endRotate);
        svg.style.setProperty('--scale', params.scale);
        svg.style.setProperty('--opacity', params.opacity);
        svg.style.setProperty('--duration', params.duration);
        svg.style.setProperty('--delay', params.delay);
        
        // Начальный размер (будет увеличен в 200 раз анимацией)
        svg.style.width = arcData.baseSize + 'px';
        svg.style.height = arcData.baseSize + 'px';
        
        arcsContainer.appendChild(svg);
      }
    }

    // ===== Последовательность анимации =====
    function startAnimationSequence() {
      // 1. Логотип уже появился через CSS (0.3s задержка + 1.2s анимация)
      
      // 2. Запускаем укрупнение и исчезновение логотипа (через 2с после появления)
      setTimeout(() => {
        logoStage.classList.add('expanding');
      }, 2300);
      
      // 3. Создаем и показываем арки (когда логотип почти исчез)
      setTimeout(() => {
        createArcs();
        
        // Показываем арки с небольшой задержкой для плавности
        setTimeout(() => {
          document.querySelectorAll('.arc').forEach((arc, index) => {
            setTimeout(() => {
              arc.classList.add('visible');
            }, index * 300);
          });
        }, 500);
      }, 3800);
      
      // 4. Показываем текстовый контент (когда арки уже в движении)
      setTimeout(() => {
        heroContent.classList.add('visible');
      }, 5500);
    }

    // ===== Запуск после загрузки =====
    window.addEventListener('load', startAnimationSequence);

    // ===== Ресайз: пересоздаем арки с новыми параметрами =====
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        // Очищаем старые арки
        arcsContainer.innerHTML = '';
        // Создаем новые с актуальными координатами
        createArcs();
        // Показываем их (они уже должны быть видимыми)
        document.querySelectorAll('.arc').forEach(arc => {
          arc.classList.add('visible');
        });
      }, 300);
    });

    // ===== Оптимизация: пауза анимаций при неактивной вкладке =====
    document.addEventListener('visibilitychange', () => {
      const arcs = document.querySelectorAll('.arc');
      arcs.forEach(arc => {
        arc.style.animationPlayState = document.hidden ? 'paused' : 'running';
      });
    });
  </script>
</body>
</html>
